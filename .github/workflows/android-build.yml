name: Build MobileDoctorPro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -o MobileDoctorPro_V1.5.9_Source.zip -d source
  
      - name: Add diagnostic permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("source/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.ACCESS_WIFI_STATE",
              "android.permission.INTERNET",
              "android.permission.READ_PHONE_STATE",
              "android.permission.ACCESS_FINE_LOCATION"
              "android.permission.VIBRATE" 
              ]

          for permission in permissions:
              tag = f'<uses-permission android:name="{permission}" />'
              if permission not in s:
                  s = s.replace("<application", f"    {tag}\n    <application", 1)

          p.write_text(s)
          print("Diagnostic permissions added successfully")
          PY
          
      - name: Copy latest MainActivity
        run: |
          mkdir -p source/app/src/main/java/com/mobiledoctorpro/app
          cp MainActivity.kt source/app/src/main/java/com/mobiledoctorpro/app/MainActivity.kt
          
      - name: Verify project files
        run: |
          ls -la source
          test -f source/app/build.gradle.kts

      - name: Inspect Gradle settings
        run: |
          echo "----- app/build.gradle.kts -----"
          cat source/app/build.gradle.kts
      
      - name: Fix Java Kotlin version mismatch
        run: |
          cat >> source/app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF
          tail -n 12 source/app/build.gradle.kts -      
 
      - name: Build APK
        working-directory: source
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileDoctorPro-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
