name: Build MobileDoctorPro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -o MobileDoctorPro--Source-For-GitHub.zip -d source
   
      - name: Copy latest MainActivity
        run: |
          mkdir -p source/app/src/main/java/com/mobiledoctorpro/app
          cp MainActivity.kt source/app/src/main/java/com/mobiledoctorpro/app/MainActivity.kt
          
      - name: Verify project files
        run: |
          ls -la source
          test -f source/app/build.gradle.kts

      - name: Fix Java Kotlin version mismatch
        run: |
          sed -i 's/VERSION_1_8/VERSION_17/g' source/app/build.gradle.kts
          grep -nE 'VERSION_|jvmTarget|sourceCompatibility|targetCompatibility' source/app/build.gradle.kts
      - name: Build APK
        working-directory: source
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MobileDoctorPro-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
