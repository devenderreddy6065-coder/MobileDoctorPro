      - name: Fix Java Kotlin version mismatch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/app/build.gradle.kts")
          s = p.read_text()
          old = "android {\n"
          new = """android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          """
          if old not in s:
              raise SystemExit("android block not found")
          p.write_text(s.replace(old, new, 1))
          PY
          cat source/app/build.gradle.kts